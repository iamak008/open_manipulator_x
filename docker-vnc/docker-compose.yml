version: "3.9"
services:
  omx_vnc:
    container_name: omx_vnc
    build:
      context: .
      dockerfile: Dockerfile
    image: omx_vnc:jazzy
    restart: unless-stopped
    shm_size: "4g"
    security_opt:
      - seccomp:unconfined

    # Bridge mode + explicit port so you visit http://localhost:6080
    ports:
      - "6080:80"

    # GPU passthrough (requires nvidia-container-toolkit on host)
    gpus: all

    # USB passthrough (broad but convenient)
    privileged: true
    devices:
      - "/dev:/dev"
      # Add specific serials if needed:
      # - "/dev/ttyUSB0:/dev/ttyUSB0"
      # - "/dev/ttyACM0:/dev/ttyACM0"

    environment:
      - RESOLUTION=1440x900
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=42
      # Ensure discovery across processes (inside the container)
      - ROS_LOCALHOST_ONLY=0

    volumes:
      # Persist your workspace + logs on the host
      - /dev:/dev
      - ./workspace:/workspace
      - ~/robotics/omx_vnc_ws:/home/ubuntu/omx_ws
      - ~/robotics/omx_logs:/home/ubuntu/logs
