services:
  open_manipulator_vnc:
    container_name: open_manipulator_vnc
    build:
      context: .
      dockerfile: Dockerfile
      shm_size: '2gb'
    image: robotis/open-manipulator-vnc:jazzy
    tty: true
    stdin_open: true
    restart: unless-stopped
    
    # Port mapping for noVNC browser access
    ports:
      - "6080:80"      # noVNC web interface
      - "5900:5900"    # VNC direct access (optional)
    
    # Security and performance settings
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    security-opt:
      - seccomp=unconfined
    
    # Shared memory for Gazebo performance
    shm_size: '4gb'
    
    # Environment variables
    environment:
      - RESOLUTION=1440x900          # VNC resolution
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=42
      - USER=ubuntu
      - PASSWORD=ubuntu              # Change this for security!
      - HTTP_PASSWORD=ubuntu         # Change this for security!
      # NVIDIA GPU passthrough (optional)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility
    
    # Volume mounts
    volumes:
      # Persist workspace on host
      - ./workspace:/home/ubuntu/omx_ws/:rw
      # Persist logs on host
      - ./logs:/home/ubuntu/logs:rw
      # USB device access (for U2D2 / real hardware)
      - /dev:/dev
    # GPU device exposure
    # - /dev/dri for Intel/AMD DRM (VA-API) and GPUs
    devices:
      - "/dev/dri:/dev/dri"
    # For NVIDIA support you may need the nvidia runtime / container toolkit on the host
    # and the runtime/device_requests below (runtime is a hint; device_requests preferred by modern Compose)
    runtime: nvidia
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    
    # Required for USB device access (U2D2, cameras)
    privileged: true
    
    # Network mode for ROS 2 DDS communication
    network_mode: host
    
    command: bash -c "sudo service supervisor start && tail -f /dev/null"
